<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Arqueveon Walker, AI deployment strategist: from pilot to production">
  <rect width="1200" height="300" fill="#141414"/>
  <rect x="0" y="0" width="1200" height="6" fill="#ffe600"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="56" y="112" fill="#ecebe7" font-size="46" font-weight="700">Arqueveon Walker</text>
