    <circle cx="700" cy="205" r="11" fill="#141414" stroke="#ecebe7" stroke-width="3"/>
    <circle cx="870" cy="120" r="9" fill="#141414" stroke="#ecebe7" stroke-width="3"/>
    <circle cx="1040" cy="150" r="9" fill="#141414" stroke="#ecebe7" stroke-width="3"/>
    <circle cx="1130" cy="95" r="14" fill="#ffe600"/>
    <text x="700" y="240" text-anchor="middle">pilot</text>
