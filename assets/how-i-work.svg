<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="How I work: discover, design, AI builds, prove with evals, deploy and adopt, with a human approval gate before production">
  <style>
    .bg{fill:#ffffff}.card{fill:#efefec}.ink{fill:#141414}.mute{fill:#5c5c58}.line{stroke:#141414}.gate{fill:#ffe600}.num{fill:#141414}.numt{fill:#ffe600}
    @media (prefers-color-scheme: dark){.bg{fill:#0d1117}.card{fill:#1f2328}.ink{fill:#ecebe7}.mute{fill:#a3a29c}.line{stroke:#ecebe7}.num{fill:#ffe600}.numt{fill:#141414}}
    text{font-family:Segoe UI,Helvetica Neue,Arial,sans-serif}
  </style>
  <rect class="bg" width="1200" height="260"/>
  <g>
    <rect class="card" x="20" y="40" width="210" height="170"/>
    <rect class="card" x="255" y="40" width="210" height="170"/>
    <rect class="card" x="490" y="40" width="210" height="170"/>
    <rect class="card" x="725" y="40" width="210" height="170"/>
    <rect class="card" x="970" y="40" width="210" height="170"/>
  </g>
  <g class="line" stroke-width="3" fill="none">
    <path d="M232 125 h20"/><path d="M467 125 h20"/><path d="M702 125 h20"/><path d="M937 125 h30"/>
  </g>
  <g>
    <polygon class="ink" points="252,119 252,131 260,125"/>
    <polygon class="ink" points="487,119 487,131 495,125"/>
    <polygon class="ink" points="722,119 722,131 730,125"/>
    <polygon class="ink" points="967,119 967,131 975,125"/>
  </g>
  <g>
    <rect class="gate" x="936" y="98" width="30" height="54" rx="3"/>
    <text x="951" y="92" text-anchor="middle" font-size="11" class="mute">human</text>
    <text x="951" y="170" text-anchor="middle" font-size="11" class="mute">approval</text>
  </g>
  <g font-size="15">
    <circle class="num" cx="48" cy="68" r="14"/><text class="numt" x="48" y="73" text-anchor="middle" font-weight="700">1</text>
    <text class="ink" x="40" y="112" font-size="20" font-weight="700">Discover</text>
    <text class="mute" x="40" y="140">Sit with the team.</text>
    <text class="mute" x="40" y="162">Map how the work</text>
    <text class="mute" x="40" y="184">really flows.</text>

    <circle class="num" cx="283" cy="68" r="14"/><text class="numt" x="283" y="73" text-anchor="middle" font-weight="700">2</text>
    <text class="ink" x="275" y="112" font-size="20" font-weight="700">Design</text>
    <text class="mute" x="275" y="140">Specs, prompts and</text>
    <text class="mute" x="275" y="162">agent designs with</text>
    <text class="mute" x="275" y="184">guardrails.</text>

    <circle class="num" cx="518" cy="68" r="14"/><text class="numt" x="518" y="73" text-anchor="middle" font-weight="700">3</text>
    <text class="ink" x="510" y="112" font-size="20" font-weight="700">AI builds</text>
    <text class="mute" x="510" y="140">Claude and low-code</text>
    <text class="mute" x="510" y="162">tools build it; I read</text>
    <text class="mute" x="510" y="184">and review the result.</text>

    <circle class="num" cx="753" cy="68" r="14"/><text class="numt" x="753" y="73" text-anchor="middle" font-weight="700">4</text>
    <text class="ink" x="745" y="112" font-size="20" font-weight="700">Prove</text>
    <text class="mute" x="745" y="140">Evals and real</text>
    <text class="mute" x="745" y="162">outcomes. Provisional</text>
    <text class="mute" x="745" y="184">until proven.</text>

    <circle class="num" cx="998" cy="68" r="14"/><text class="numt" x="998" y="73" text-anchor="middle" font-weight="700">5</text>
    <text class="ink" x="990" y="112" font-size="20" font-weight="700">Deploy &amp; adopt</text>
    <text class="mute" x="990" y="140">Runbook, training,</text>
    <text class="mute" x="990" y="162">and staying until</text>
    <text class="mute" x="990" y="184">people trust it.</text>
  </g>
</svg>
